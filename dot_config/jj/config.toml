"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

# this can be overridden by env var
[user]
name = "gaojunran"
email = "nebula2021@126.com"

[remotes.origin]
auto-track-bookmarks = "*"

[ui]
default-command = "log"
ui.diff-editor = ":builtin"
conflict-marker-style = "git"   # 与其他工具兼容
pager = ["hunk", "pager"]       # https://github.com/modem-dev/hunk
diff-formatter = ":git"         # git 风格 diff

[revsets]
bookmark-advance-to = "closest_pushable(@)"

[aliases]
open = ["log", "-r", "heads(mine()) ~ ::trunk()"]

[revset-aliases]
'closest_bookmark(to)' = 'heads(::to & bookmarks())'
'closest_pushable(to)' = 'heads(::to & ~description(exact:"") & (~empty() | merges()))'

[[--scope]]
--when.repositories = ["~/Work"]
[--scope.user]
name = "junrangao"
email = "junrangao@tencent.com"
