# Quick jump to directories
[[manager.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/Downloads"
desc = "Cd to ~/Downloads"

[[manager.prepend_keymap]]
on   = [ "g", "i" ]
run  = "cd ~/Projects"
desc = "Cd to ~/Projects"

[[manager.prepend_keymap]]
on   = [ "g", "s" ]
run  = "cd ~/Pictures/Screenshots"
desc = "Cd to ~/Pictures/Screenshots"

[[manager.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Playground"
desc = "Cd to ~/Playground"

[[manager.prepend_keymap]]
on   = [ "g", "o" ]
run  = "cd ~/Documents"
desc = "Cd to ~/Documents"

# Actions
[[manager.prepend_keymap]]
on   = [ "c", "c" ]
run  = 'shell "cb copy $@"'
desc = "Copy to clipboard"

[[manager.prepend_keymap]]
on   = [ "c", "x" ]
run  = 'shell "cb cut $@"'
desc = "Copy to clipboard"

[[manager.prepend_keymap]]
on   = [ "c", "v" ]
run  = 'shell "cb paste" --block'
desc = "Paste from clipboard"

[[manager.prepend_keymap]]
on   = [ "c", "p" ]
run  = 'copy path'
desc = "Copy file path"

[[manager.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

[[manager.prepend_keymap]]
on   = [ "`" ]
run  = 'quit'
desc = "Quit Yazi"
