[[manager.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/Downloads"
desc = "Cd to ~/Downloads"

[[manager.prepend_keymap]]
on   = [ "g", "." ]
run  = "cd ~/.config"
desc = "Cd to ~/.config"

[[manager.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Projects"
desc = "Cd to ~/Projects"

[[manager.prepend_keymap]]
on   = [ "g", "s" ]
run  = "cd ~/Pictures/Screenshots"
desc = "Cd to ~/Pictures/Screenshots"

[[manager.prepend_keymap]]
on   = [ "g", "t" ]
run  = "cd ~/Playground"
desc = "Cd to ~/Playground"

[[manager.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Documents"
desc = "Cd to ~/Documents"