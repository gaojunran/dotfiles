[settings]
env_shell_expand = false

[env]
BASE_BRANCH_COMMAND = """
jj log -r "bookmarks(glob:'v*')" --no-graph -T 'bookmarks ++ "\\n"' | tr -d ' ' | grep -E '^v[0-9]+\\.[0-9]+\\.[0-9]+$' | sort -V | tail -1
"""

[tasks.dev-novel]
alias = "dn"
dir = "{{config_root}}"
run = "bun run .local/dev-novel.ts"

[tasks.dev-novel-auto]
alias = "dna"
dir = "{{config_root}}"
run = "bun run .local/dev-novel.ts --auto"

[tools]
node = "20"
pnpm = "8"
